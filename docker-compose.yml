# =============================================================================
#  方舟：生存进化（ASE）专用服务器 —— docker compose 编排文件
#
#  使用：
#    cp .env.example .env      # 按需修改端口/密码/倍率
#    docker compose up -d --build
#    docker compose logs -f
# =============================================================================

services:
  ark:
    build:
      context: .
      dockerfile: Dockerfile
      # ⚠ 构建镜像这一层走的是「Docker 引擎自己的网络出口」，和下面 environment 里的
      #   代理无关：拉 debian:12-slim、apt-get、下载 SteamCMD 都是引擎/BuildKit 发起的。
      #   若构建时报 registry-1.docker.io ... EOF，要去配镜像加速器或 Docker Desktop 代理，
      #   见 README FAQ 14。
      #   确实需要构建期也走代理时，在执行的 shell 里带上再构建（注意要用
      #   host.docker.internal，因为 RUN 步骤跑在 Docker 虚拟机的容器里）：
      #     bash:  HTTP_PROXY=http://host.docker.internal:7890 docker compose build
      #     PS:    $env:HTTP_PROXY="http://host.docker.internal:7890"; docker compose build
    image: ark-ase-server:latest
    container_name: ark-server
    # 不自动启动：只在手动执行 `docker compose up -d` 时才起来。
    # 注意 WSL2 的启动链是「WSL 启动 → systemd → docker.service → 容器」，
    # 早先这里是 unless-stopped，导致只要打开一次 WSL 终端、或 VS Code 连一下
    # WSL、甚至跑任意一条 wsl 命令，服务端就会自己跑起来。
    # 改成 "no" 后即使 docker 守护进程起来了，容器也不会自己启动。
    restart: "no"
    # 停机时给够时间：入口脚本会先发 SIGINT 让服务端保存世界
    stop_grace_period: 150s
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      # 代理：国内直连 Steam 不稳定时，在 .env 里填 PROXY_HTTP / PROXY_HTTPS / PROXY_NO。
      # ⚠ 这一组只作用于「容器运行时」——SteamCMD 下载服务端与模组、服务端本身联网。
      #   它对 docker build 完全无效（env_file 不参与构建），构建报错请看 README FAQ 14。
      #
      # ⚠⚠ 两边【刻意不同名】，这是踩过坑之后的设计，改之前请先读完：
      #   docker compose 做变量插值时的优先级是「宿主机 shell 环境 > .env 文件」。
      #   也就是说，如果这里直接写 ${HTTP_PROXY:-}，那么只要宿主机（Windows 系统代理、
      #   Clash 的「系统代理」开关、WSL 的 /etc/environment 等）本来就导出过 HTTP_PROXY，
      #   就会**盖掉** .env 里的空值，把宿主机的代理硬塞进容器 —— 而且通常是错的端口。
      #   后果就是 SteamCMD 报 Missing file permissions / Missing configuration（见 README FAQ 15）。
      #   用 PROXY_HTTP 这种专属名字，宿主机几乎不可能同名，.env 因此成为唯一权威来源。
      #   （容器里最终看到的仍然是标准的 HTTP_PROXY / http_proxy，两者都注入。）
      #
      # ⚠ 宿主机已开 Clash / Surge 的 TUN 模式时，**不要再配这一层**：TUN 的默认路由
      #   metric 抢在物理网卡之前，容器出网已经被整体接管，再叠一层代理只会打架
      #   （TUN 的 fake-ip 会把 host.docker.internal 解析成 198.18.x.x，容器连不过去，
      #   SteamCMD 会卡在 'Connecting anonymously to Steam Public...Retrying...' 无限重试）。
      #   遇到「配了代理反而更差」，先把 .env 里这三项清空、并把代理软件切回「直连」验证。
      # ⚠ 端口别想当然：Clash Verge 的 HTTP/SOCKS 混合端口默认是 7897（老版本才是 7890）。
      #   填错端口 = 代理等于没配，还会把本来通的直连也弄坏。
      # ⚠ 代理跑在宿主机（Windows/WSL）上时，容器里的 127.0.0.1 指的是容器自己，
      #   必须写成 host.docker.internal（见下面 extra_hosts）。
      # ⚠ 大小写必须同时给：Docker 引擎、apt、wget 这些认大写，但 curl 和
      #   SteamCMD 内部的下载链路只认小写的 http_proxy / https_proxy。
      #   只填大写 = SteamCMD 实际没走代理，这是「配了代理也没用」的常见原因。
      #   .env 里只需要填大写这一组，compose 会自动补出小写形式。
      #
      # ⚠⚠⚠ 改完 .env 里的这三项后，必须 `docker compose up -d --force-recreate`
      #   才会生效 —— 环境变量在容器【创建】时就固化了，`docker compose restart`
      #   和 restart 策略的自动重启都【不会】重读 .env。这一点极其容易踩：
      #   .env 里明明清空了代理，容器里却还是旧代理，于是「怎么改都没用」。
      HTTP_PROXY: ${PROXY_HTTP:-}
      HTTPS_PROXY: ${PROXY_HTTPS:-}
      NO_PROXY: ${PROXY_NO:-}
      http_proxy: ${PROXY_HTTP:-}
      https_proxy: ${PROXY_HTTPS:-}
      no_proxy: ${PROXY_NO:-}
      # 下面两项只用于「容器内自检」：把 .env 里的原始意图也带进容器，
      # 入口脚本借此识别「容器里的 HTTP_PROXY 其实是旧容器固化的、.env 早就清空了」。
      # 这正是最难查的一类故障：改 .env 后只 restart 没重建，于是怎么改都没用。
      PROXY_HTTP: ${PROXY_HTTP:-}
      PROXY_HTTPS: ${PROXY_HTTPS:-}
    # ⚠ WSL 原生 dockerd 不会自动提供 host.docker.internal（只有 Docker Desktop 会）。
    #   不声明这个名字，容器就会拿宿主机的 DNS 去解析，被代理软件的 fake-ip 抢答成
    #   198.18.x.x 之类的假地址 —— 表现就是"代理端口明明开着，容器却连不上"。
    #   host-gateway 是 Docker 20.10+ 的内置关键字，指向宿主机的网关地址。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # =========================================================================
    #  网络模式：默认 bridge（端口经 Docker 映射，出网走 docker NAT）
    #
    #  ⚠⚠ 别轻易改 host：实测在「WSL2 镜像网络 + Clash TUN」环境下，host 模式会让
    #  容器默认路由直接走 TUN（default via 198.18.0.2），出网被吞 —— SteamCMD 连不上
    #  Steam，卡在 "Connecting anonymously to Steam Public...Retrying..."，服务起不来。
    #  同一环境下 bridge 模式 curl Steam 返回 200，正常。
    #
    #  需要 host 模式的场合（宿主机无 TUN 干扰、跑在 Linux 服务器上等）：
    #    1. 打开下面这行 network_mode，并注释掉 ports: 段
    #    2. docker compose up -d --force-recreate
    #  切到 host 后，.env 里的 PORT / RAW_PORT / QUERY_PORT / RCON_PORT 就是宿主机端口，
    #  多实例时这些端口必须各不相同。
    # =========================================================================
    # network_mode: host
    ports:
      # ⚠ 服务器对外宣告的端口就是它自己监听的端口，所以这里内外必须一致（${X}:${X}）。
      #   改 PORT 时请同步把 RAW_PORT 设成 PORT+1（原版原始套接字固定为游戏端口+1）。
      - "${PORT:-7777}:${PORT:-7777}/udp"        # 游戏主端口
      - "${RAW_PORT:-7778}:${RAW_PORT:-7778}/udp" # 原始套接字（Raw Socket）
      - "${QUERY_PORT:-27015}:${QUERY_PORT:-27015}/udp" # Steam 查询端口（服务器列表发现）
      - "${RCON_PORT:-32330}:${RCON_PORT:-32330}/tcp"   # RCON 管理端口（仅建议内网/白名单开放）
    volumes:
      # 数据目录由 .env 里的 DATA_DIR 决定（默认 ./data）。
      # ⚠ Windows + WSL：不要用 /mnt/c 下的路径，9p/DrvFs 不保留 Linux 权限语义，
      #   会让 SteamCMD 报 "Missing file permissions" 而装不上服务端。
      #   请改到 WSL 原生路径，例如 DATA_DIR=/home/你的用户名/ark-data
      #
      # 服务端本体 + 存档 + 模组（约 10~20 GB，务必持久化）
      - ${DATA_DIR:-./data}/server:/ark
      # SteamCMD 与创意工坊缓存（避免每次重建容器都重下模组）
      - ${DATA_DIR:-./data}/steamcmd:/opt/steamcmd
      # 备份
      - ${DATA_DIR:-./data}/backup:/backup
      # 自定义配置覆盖目录（只读挂载）
      - ./config:/etc/ark/config:ro
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
      nproc: 65535
    # =========================================================================
    #  日志：必须限大小。默认 json-file 是不限的，ARK 又很能刷（SteamCMD 每次启动
    #  都会把整段交互打出来），几天就能涨到几百 MB，docker logs 会被拖慢。
    #  更关键的是：json-file 是「读到第一条无法解析的行就停」，文件越大、被硬断电
    #  写坏的概率越高，坏了之后 docker logs 就再也读不到新内容（见 README FAQ 25）。
    #  轮转虽然不能杜绝写坏，但能把单文件体积和故障影响面压住。
    # =========================================================================
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    stdin_open: true
    tty: true
    networks:
      - arknet
    healthcheck:
      # 注意：模式必须写成 [S]hooterGameServer。若写成 ShooterGameServer，
      # pgrep -f 会匹配到执行本命令的 `sh -c "pgrep -f ShooterGameServer ..."` 自身，
      # 结果永远返回 0 —— 服务端没起来也会被判定为 healthy。
      test: ["CMD-SHELL", "pgrep -f '[S]hooterGameServer' >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 20m
      retries: 3

# =============================================================================
#  容器网络：显式指定网段，避开 WSL2 的 NAT 网段
#
#  ⚠ 不要删掉这段让它走默认。WSL2 的 eth0 网段是自动分配的（172.16.0.0/12 里挑一个
#  /20），每次重启可能变，而且**可能与 Docker 网桥重叠**。实测踩过一次：
#  WSL 被分到 172.18.46.222，而 compose 默认网桥正好是 172.18.0.0/16 ——
#  两者重叠导致路由歧义，Windows 侧发往 WSL 的 UDP 全部超时（ping 却通，
#  因为 ICMP 走的是另一条路）。
#  把 Docker 挪到 172.30.0.0/16 后立刻恢复。选段原则：避开 172.17（docker0）、
#  172.18~172.31（WSL 可能占用的范围），172.30 是相对安全的选择。
#  若你的 WSL 恰好也在 172.30，改成本机 `ip -4 addr show eth0` 里没出现的其他段。
# =============================================================================
networks:
  arknet:
    name: ark-ase-net
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1

